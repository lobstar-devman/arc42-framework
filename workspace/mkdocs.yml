site_name: Architecture Documentation
site_description: Living architecture documentation generated from sources of truth (BPMN/CMMN/DMN, Structurizr DSL, OpenAPI, JSON Schema, Mermaid)
docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - content.code.copy

plugins:
  - search
  - mermaid2
  - awesome-pages

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid
  - pymdownx.highlight
  - pymdownx.details

# Nav follows the arc42 template, with C4-model diagrams (generated from
# Structurizr DSL) embedded in the Building Block / Context / Deployment
# views. Every page here is generated or regenerated by the CI pipeline
# from its corresponding source of truth — never hand-edited diagrams.
nav:
  - Home: index.md
  - Architecture (arc42):
      - "1. Introduction & Goals": arc42/01-introduction-and-goals.md
      - "2. Constraints": arc42/02-constraints.md
      - "3. Context & Scope": arc42/03-context-and-scope.md
      - "4. Solution Strategy": arc42/04-solution-strategy.md
      - "5. Building Block View": arc42/05-building-block-view.md
      - "6. Runtime View": arc42/06-runtime-view.md
      - "7. Deployment View": arc42/07-deployment-view.md
      - "8. Cross-cutting Concepts": arc42/08-crosscutting-concepts.md
      - "9. Architecture Decisions": arc42/09-architecture-decisions.md
      - "10. Quality Requirements": arc42/10-quality-requirements.md
      - "11. Risks & Technical Debt": arc42/11-risks-and-technical-debt.md
      - "12. Glossary": arc42/12-glossary.md
  - Sources of Truth:
      - Overview: sources-of-truth/index.md
      - BPMN / CMMN / DMN: sources-of-truth/bpmn-cmmn-dmn.md
      - Structurizr DSL (C4): sources-of-truth/structurizr-dsl.md
      - OpenAPI: sources-of-truth/openapi.md
      - JSON Schema: sources-of-truth/json-schema.md
      - Mermaid (UML/ERD): sources-of-truth/mermaid.md
  - Decisions (ADRs):
      - Overview: decisions/index.md
